<!DOCTYPE html>
<!-- Indica que usamos HTML5 -->

<html lang="en">
<!-- Inicio del documento -->

<head>
    <!-- Información de la página -->

    <meta charset="UTF-8">
    <!-- Permite usar acentos y caracteres especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adapta la página a diferentes pantallas -->

    <title>Imagenes en HTML</title>
    <!-- Título de la página -->

</head>

<body>
    <!-- Contenido visible de la página -->

    <h2>Imagenes en HTML</h2>
    <!-- Título principal -->

    <h3>Locales</h3>
    <!-- Título para imágenes locales -->

    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- Muestra una imagen guardada en la carpeta -->

    <h3>Locales redimensionado</h3>
    <!-- Título para una imagen cambiada de tamaño -->

    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!-- Muestra la imagen con un tamaño definido -->

    <h3>Desde internet</h3>
    <!-- Título para una imagen de internet -->

    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!-- Muestra una imagen usando un enlace -->

    <h3>Animaciones</h3>
    <!-- Título para la imagen animada -->

    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    <!-- Muestra una animación de internet -->

</body>
<!-- Fin del contenido -->

</html>
<!-- Fin del documento -->
