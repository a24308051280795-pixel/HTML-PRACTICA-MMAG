<!DOCTYPE html>
<!-- Indica que usamos HTML5 -->

<html lang="en">
<!-- Inicio del documento y define el idioma -->

<head>
    <!-- Aquí va la información de la página -->

    <meta charset="UTF-8">
    <!-- Permite usar acentos y caracteres especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte a la pantalla -->

    <title>Enlaces en HTML</title>
    <!-- Título que aparece en la pestaña -->

</head>

<body>
    <!-- Contenido visible de la página -->

    <h2>Tipos de enlaces en HTML</h2>
    <!-- Título principal -->

    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!-- Texto que indica enlaces del mismo sitio -->

    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- Enlace a la página Hola Mundo -->

    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- Abre el enlace en la misma pestaña -->

    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!-- Abre el enlace en otra pestaña -->

    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!-- Abre el enlace en el marco principal -->

    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <!-- Abre el enlace en toda la ventana -->

    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <!-- Texto que indica enlaces externos -->

    <a href="https://www.google.com/">Google</a><br>
    <!-- Enlace a Google -->

    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <!-- Abre YouTube en la misma pestaña -->

    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <!-- Abre Facebook en otra pestaña -->

    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <!-- Abre Wikipedia en el marco principal -->

    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
    <!-- Abre Yahoo en toda la ventana -->

</body>
<!-- Fin del contenido -->

</html>
<!-- Fin del documento HTML -->
