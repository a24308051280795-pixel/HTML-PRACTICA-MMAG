<!-- Define el documento como html -->
<!DOCTYPE html>
<!-- Define el idioma -->
<html lang="en">
<!-- Encabezado -->
<head>
    <!-- Define caracteres -->
    <meta charset="UTF-8">
    <!-- Define como se vera en otros dispositivos, renderización -->
    <meta name="viewport" content="width=device-width, initial-scale=4.0">
    <!-- Titulo principal -->
    <title>Parrafos HTML</title>
<!-- Encabezado se cierra -->
</head>
<!-- Cuerpo -->
<body>
    <!-- Titulo de la sección -->
    <h1>Estructura del html</h1>
    <!-- titulo 2 -->
    <h2>Body</h2>
    <!-- Párrafo 1 -->
    <p>Contiene los metadatos del sitio web, configuraciones y el titulo de la pestaña</p>
    <!-- titulo 3 con el mismo preset de titulo -->
    <h2>Body</h2>
    <!-- Párrafo 2 -->
    <p>muestra los elementos visuales que ve el usuario</p>
    <!-- titulo 4 con el mismo preset de titulo -->
    <h2>footer</h2>
    <!-- Párrafo 3 -->
    <p>Muestra la informacion del autor de la pagina, creditos, informacion relevante, etc.</p>
<!-- Cierra cuerpo -->
</body>
<!-- Termina la pagina -->
</html>
