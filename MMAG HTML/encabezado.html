<!-- Define el documento como html -->
<!DOCTYPE html>
<!-- Define el idioma principal -->
<html lang="en">
<!-- Encabezado -->
<head>
    <!-- Define los caracteres -->
    <meta charset="UTF-8">
    <!-- Configura la escala de visualización de cada dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=4.0">
    <!-- Define el titulo principal de la pagina -->
    <title>Encabezados html</title>
<!-- Cierra encabezado -->
</head>
<!-- Cuerpo -->
<body>
    <!-- Inicia tipos de titulos y subtitulos para mostrar -->
    <h1>titulo 1</h1>
    <h2>titulo 2</h2>
    <h3>titulo 3</h3>
    <h4>titulo 4</h4>
    <h5>titulo 5</h5>
    <h6>titulo 6</h6>
<!-- Cierra el body -->
</body>
<!-- Termina la pagina -->
</html>
